services:
  # NexusAI Web Service
  - type: web
    name: nexus-ai-platform
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: FLASK_ENV
        value: production
      - key: NEXUS_PRODUCTION
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexus-redis
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false

  # Redis Service (Corrected syntax)
  - type: redis
    name: nexus-redis
    plan: free
    region: oregon
    ipAllowList: []
